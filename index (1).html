<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e-Card modelo</title>
<style>
:root{
  --bg:#f3efe8; --ink:#1d2433; --muted:#5b6475; --line:#d8d2c6;
  --card:#e8a33d; --card-bar:#b06f12; --card-ink:#2a1d08; --panel:#fffdf9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171f; --ink:#eceff5; --muted:#9aa3b5; --line:#2b3140; --panel:#1c202b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-columns:minmax(280px,380px) minmax(280px,360px);gap:40px;justify-content:center;align-items:start;padding:32px 16px}
@media (max-width:760px){body{grid-template-columns:1fr;justify-items:center}}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #3b6fe0;outline-offset:2px}
button{margin-top:16px;padding:10px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:inherit;cursor:pointer}
.note{font-size:.82rem;color:var(--muted);margin-top:14px}

/* cartão */
.ecard{width:100%;max-width:360px;background:var(--card);color:var(--card-ink);border-radius:18px;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.18);text-align:center;padding-bottom:18px}
.bar{background:var(--card-bar);color:#fff;text-align:left;padding:14px 18px;font-weight:600;font-size:1.1rem}
.logo{margin:18px auto 2px;width:150px;height:64px}
.inst{font-size:1rem;margin:0 0 14px}
.role{letter-spacing:.02em;margin:0 0 10px}
.photo{width:150px;height:200px;margin:0 auto 12px;border:1px solid rgba(0,0,0,.25);background:#dfe4ea;object-fit:cover;display:block}
.name{font-weight:700;font-size:1.2rem;margin:0}
.meta{margin:4px 14px 0}
.qr{background:#fff;width:150px;height:150px;margin:14px auto 8px;padding:12px;border-radius:4px}
.qr svg{width:100%;height:100%;display:block}
.exp{font-size:.82rem;margin:0}
</style>
</head>
<body>
<section>
  <h1>e-Card modelo</h1>
  <p class="sub">Dados fictícios para testar o layout. Nada é enviado a servidor.</p>
  <div class="panel">
    <label for="f-nome">Nome</label>
    <input id="f-nome" value="Maria Exemplo da Silva">
    <label for="f-id">Número de identificação</label>
    <input id="f-id" value="0000000">
    <label for="f-unid">Unidade</label>
    <input id="f-unid" value="Faculdade de Exemplos Aplicados">
    <label for="f-vinc">Vínculo</label>
    <select id="f-vinc"><option>ALUNO</option><option>SERVIDOR</option><option>VISITANTE</option></select>
    <label for="f-nivel">Nível</label>
    <input id="f-nivel" value="GRADUAÇÃO">
    <label for="f-foto">Foto (fica só no seu navegador)</label>
    <input id="f-foto" type="file" accept="image/*">
    <button id="btn-qr" type="button">Gerar outro QR fictício</button>
    <p class="note">O QR é um desenho aleatório e não aponta para nenhum sistema real.</p>
  </div>
</section>

<section aria-label="Pré-visualização do cartão">
  <article class="ecard">
    <div class="bar">e-Card</div>
    <svg class="logo" viewBox="0 0 150 64" role="img" aria-label="Logotipo fictício">
      <rect x="3" y="3" width="144" height="58" rx="8" fill="none" stroke="#2a1d08" stroke-width="5"/>
      <text x="75" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="28" fill="#2a1d08">UEX</text>
    </svg>
    <p class="inst">Universidade de São Paulo</p>
    <p class="role" id="o-vinc">ALUNO</p>
    <img class="photo" id="o-foto" alt="Foto do titular" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 200'%3E%3Crect width='150' height='200' fill='%23dfe4ea'/%3E%3Ccircle cx='75' cy='80' r='30' fill='%23a9b2c0'/%3E%3Cpath d='M20 200c0-45 25-70 55-70s55 25 55 70z' fill='%23a9b2c0'/%3E%3C/svg%3E">
    <p class="name" id="o-nome"></p>
    <p class="meta" id="o-id"></p>
    <p class="meta" id="o-unid"></p>
    <p class="meta" id="o-nivel"></p>
    <div class="qr" id="o-qr" aria-label="QR code fictício"></div>
    <p class="exp" id="o-exp"></p>
  </article>
</section>

<script>
const $ = id => document.getElementById(id);

// Texto
[["f-nome","o-nome"],["f-id","o-id"],["f-unid","o-unid"],["f-vinc","o-vinc"],["f-nivel","o-nivel"]]
  .forEach(([i,o]) => {
    const sync = () => { $(o).textContent = $(i).value; };
    $(i).addEventListener("input", sync); sync();
  });

// Foto: só leitura local
$("f-foto").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { $("o-foto").src = r.result; };
  r.readAsDataURL(file);
});

// QR fictício (padrão aleatório com marcadores de canto)
function fakeQR(n = 25){
  const cell = 4, size = n * cell;
  let rects = "";
  const finder = (x, y) => `<rect x="${x*cell}" y="${y*cell}" width="${7*cell}" height="${7*cell}" fill="#000"/>
    <rect x="${(x+1)*cell}" y="${(y+1)*cell}" width="${5*cell}" height="${5*cell}" fill="#fff"/>
    <rect x="${(x+2)*cell}" y="${(y+2)*cell}" width="${3*cell}" height="${3*cell}" fill="#000"/>`;
  const inFinder = (x, y) => (x < 8 && y < 8) || (x >= n-8 && y < 8) || (x < 8 && y >= n-8);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
    if (!inFinder(x, y) && Math.random() < 0.48)
      rects += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">${rects}${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}
$("btn-qr").addEventListener("click", () => { $("o-qr").innerHTML = fakeQR(); });
$("o-qr").innerHTML = fakeQR();

// Validade: hoje às 23h59
const hoje = new Date().toLocaleDateString("pt-BR");
$("o-exp").textContent = `o código QR expira em ${hoje} às 23h59`;
</script>
</body>
</html>
